services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: productpilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-productpilot}
      POSTGRES_DB: productpilot
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U productpilot -d productpilot']
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://productpilot:${POSTGRES_PASSWORD:-productpilot}@db:5432/productpilot?schema=public
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in your environment or .env file}
      APP_URL: ${APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      AI_PROVIDER: ${AI_PROVIDER:-auto}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - '3000:3000'
    # Apply pending migrations before the server accepts traffic.
    command: sh -c "node_modules/.bin/prisma migrate deploy && node server.js"

volumes:
  db-data:
